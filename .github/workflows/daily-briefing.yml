name: AX 데일리 브리핑
on:
  schedule:
    - cron: '0 23 * * *' # 다음 날 한국 시간 08:00, GitHub 사정에 따라 지연 가능
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ax-daily-briefing
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'modac-bull/ax-knowledge-base' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 테스트
        run: python -m unittest discover -s tests -v
      - name: 수집 및 생성
        id: briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/briefing.py
      - name: 검증한 리포트와 원문 링크만 커밋
        env:
          NOTE_PATH: ${{ steps.briefing.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NOTE_PATH" =~ ^raw/daily/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$ ]]
          test -f "$NOTE_PATH"
          LINK_PATH="raw/links/${NOTE_PATH##*/}"
          test -f "$LINK_PATH"
          git add -- "$NOTE_PATH" "$LINK_PATH"
          if git diff --cached --quiet; then
            echo '이미 저장된 브리핑입니다.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: AX 브리핑 ${NOTE_PATH##*/}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
